name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build Docker Image ngay trên máy chủ GitHub và Push lên Registry (GHCR)
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm tsc --noEmit

      - name: Check i18n messages
        run: pnpm i18n:check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://sporto.asia/api/v1
            NEXT_PUBLIC_SITE_URL=https://sporto.asia
            NEXT_PUBLIC_APP_API_KEY=${{ secrets.NEXT_PUBLIC_APP_API_KEY }}
          tags: ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:latest,ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:${{ github.sha }}

  # Job 2: Chỉ kéo bản build sạch về chạy trên VPS (Mất 5s, không tốn tài nguyên build)
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 203.167.15.81
          port: 36789
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            # 1. Đi tới thư mục chứa docker-compose.yml trên VPS
            cd /usr/local/lsws/sporto.asia

            # 2. Đăng nhập GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull image frontend mới nhất về
            docker pull ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:latest

            # 4. Khởi động lại service frontend với image mới
            docker compose up -d --force-recreate --no-deps frontend

            # 5. Dọn dẹp image rác
            docker image prune -f

            # 6. Dọn dẹp các Docker Image cũ không dùng để tránh đầy ổ cứng
            docker image prune -f
