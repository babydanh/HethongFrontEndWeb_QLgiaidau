name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build Docker Image ngay trên máy chủ GitHub và Push lên Registry (GHCR)
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm & Dependencies
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm tsc --noEmit

      - name: Check i18n messages
        run: pnpm i18n:check

      - name: Build and Push Docker Image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://sporto.asia/api/v1 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://sporto.asia \
            --build-arg NEXT_PUBLIC_APP_API_KEY="${{ secrets.NEXT_PUBLIC_APP_API_KEY }}" \
            -t ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:latest \
            -t ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:${{ github.sha }} \
            .
          docker push ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:latest
          docker push ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:${{ github.sha }}

  # Job 2: Chỉ kéo bản build sạch về chạy trên VPS (Mất 5s, không tốn tài nguyên build)
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via native SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 36789 203.167.15.81 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p 36789 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@203.167.15.81 bash -c "'
            set -euo pipefail
            cd /usr/local/lsws/sporto.asia
            echo \"$GITHUB_TOKEN\" | docker login ghcr.io -u $ACTOR --password-stdin
            docker pull ghcr.io/babydanh/hethongfrontendweb_qlgiaidau:latest
            docker compose up -d --force-recreate --no-deps frontend
            docker image prune -f
          '"
