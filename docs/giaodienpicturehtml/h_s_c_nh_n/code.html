                                                <p className="text-xs text-slate-500">ELO Pickleball: 14{i}0</p>
                                                <div className="mt-3 flex gap-2">
                                                    <button className="flex-1 py-1.5 bg-slate-50 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-100 border border-slate-200">Hồ sơ</button>
                                                    <button className="flex-1 py-1.5 bg-primary/10 text-primary text-xs font-bold rounded-lg hover:bg-primary/20">Nhắn tin</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'Giải đấu' && (
                            <div className="space-y-4">
                                {[
                                    { name: 'Giải Vô Địch Pickleball Mùa Hè', role: 'Vận động viên', res: 'Vô Địch', status: 'Kết thúc', logo: 'https://images.unsplash.com/photo-1599586120429-48281b6f0ece?q=80&w=100&auto=format&fit=crop' },
                                    { name: 'Open Tournament 2024', role: 'Vận động viên', res: 'Tứ kết', status: 'Kết thúc', logo: 'https://images.unsplash.com/photo-1626248801379-51a073446f77?q=80&w=100&auto=format&fit=crop' },
                                    { name: 'Hanoi Senior Cup', role: 'Thành viên BTC', res: '-', status: 'Đang diễn ra', logo: 'https://images.unsplash.com/photo-1521412644187-c49fa0b4e6a3?q=80&w=100&auto=format&fit=crop' },
                                ].map((tournament, i) => (
                                    <div key={i} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                                        <div className="flex items-center gap-4 w-full md:w-auto">
                                            <div className="w-12 h-12 rounded-lg bg-slate-100 overflow-hidden shrink-0">
                                                <img src={tournament.logo} alt="Tournament" className="w-full h-full object-cover" />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-sm">{tournament.name}</h4>
                                                <p className="text-xs text-slate-500">{tournament.role}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-8 w-full md:w-auto justify-between md:justify-end">
                                            <div className="text-center">
                                                <p className="text-[10px] uppercase text-slate-400 font-bold">Kết quả</p>
                                                <p className="font-bold text-primary">{tournament.res}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-[10px] uppercase text-slate-400 font-bold">Trạng thái</p>
                                                <span className={`text-xs font-medium px-2 py-0.5 rounded ${tournament.status === 'Kết thúc' ? 'bg-slate-100 text-slate-600' : 'bg-green-100 text-green-700'}`}>
                                                    {tournament.status}
                                                </span>
                                            </div>
                                            <button className="material-symbols-outlined text-slate-400 hover:text-primary transition-colors">chevron_right</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const EditProfile = ({ onCancel, onSave }) => {
            const [isLoading, setIsLoading] = useState(false);
            const [bioText, setBioText] = useState('Vận động viên Pickleball phong trào | Đam mê chinh phục mọi giải đấu');

            const handleSave = () => {
                setIsLoading(true);
                setTimeout(() => {
                    setIsLoading(false);
                    onSave();
                }, 1500);
            };

            return (
                <div className="max-w-[1200px] mx-auto px-4 sm:px-8 py-6">
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="p-6 border-b border-slate-100 flex items-center gap-3">
                                <button onClick={onCancel} className="material-symbols-outlined text-slate-400 hover:text-slate-600">arrow_back</button>
                                <h2 className="font-headline-md text-headline-md">Chỉnh sửa hồ sơ</h2>
                            </div>
                            
                            <div className="p-8 space-y-8">
                                {/* Avatar Change */}
                                <div className="flex flex-col items-center gap-4">
                                    <div className="relative group cursor-pointer">
                                        <div className="w-32 h-32 rounded-full overflow-hidden border-4 border-slate-100 bg-slate-50 relative">
                                            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=300&auto=format&fit=crop" alt="Edit" className="w-full h-full object-cover group-hover:opacity-50 transition-opacity" />
                                            <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                <span className="material-symbols-outlined text-3xl text-primary" style={{fontVariationSettings: "'FILL' 1"}}>photo_camera</span>
                                            </div>
                                        </div>
                                        <div className="absolute -bottom-1 -right-1 bg-primary text-white p-1.5 rounded-full shadow-lg border-2 border-white">
                                            <span className="material-symbols-outlined text-[16px]">edit</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-4">
                                        <button className="text-sm font-semibold text-primary hover:underline">Thay đổi ảnh</button>
                                        <button className="text-sm font-semibold text-error hover:underline">Xóa ảnh</button>
                                    </div>
                                </div>

                                {/* Main Form */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-1.5">
                                        <label className="text-sm font-bold text-slate-700">Họ và tên</label>
                                        <input type="text" defaultValue="Nguyễn Văn A" className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none" />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-sm font-bold text-slate-700">Email (Không thể sửa)</label>
                                        <input type="email" disabled defaultValue="vana.nguyen@example.com" className="w-full px-4 py-2.5 rounded-lg border border-slate-100 bg-slate-50 text-slate-400 cursor-not-allowed outline-none" />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-sm font-bold text-slate-700">Số điện thoại</label>
                                        <input type="tel" defaultValue="090 123 4567" className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none" />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-sm font-bold text-slate-700">Ngày sinh</label>
                                        <input type="date" defaultValue="1995-05-15" className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none" />
                                    </div>
                                    <div className="md:col-span-2 space-y-1.5">
                                        <div className="flex justify-between">
                                            <label className="text-sm font-bold text-slate-700">Giới thiệu bản thân (Bio)</label>
                                            <span className="text-xs text-slate-400">{bioText.length}/500</span>
                                        </div>
                                        <textarea 
                                            rows="3" 
                                            value={bioText}
                                            onChange={(e) => setBioText(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>

                            <div className="px-8 py-6 bg-slate-50 border-t border-slate-100 flex justify-end gap-4">
                                <button onClick={onCancel} className="px-6 py-2 rounded-lg font-bold text-slate-600 hover:bg-slate-100 transition-colors">Hủy bỏ</button>
                                <button 
                                    onClick={handleSave} 
                                    disabled={isLoading}
                                    className="px-8 py-2 bg-primary text-white rounded-lg font-bold hover:bg-blue-700 transition-all flex items-center gap-2 disabled:opacity-70"
                                >
                                    {isLoading ? (
                                        <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                    ) : 'Lưu thay đổi'}
                                </button>
                            </div>
                        </div>

                        {/* Password Block */}
                        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
                            <h3 className="font-headline-md text-headline-md mb-6">Đổi mật khẩu</h3>
                            <div className="space-y-4">
                                <div className="space-y-1.5">
                                    <label className="text-sm font-bold text-slate-700">Mật khẩu hiện tại</label>
                                    <input type="password" placeholder="••••••••" className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none" />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-1.5">
                                        <label className="text-sm font-bold text-slate-700">Mật khẩu mới</label>
                                        <input type="password" placeholder="••••••••" className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none" />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-sm font-bold text-slate-700">Xác nhận mật khẩu</label>
                                        <input type="password" placeholder="••••••••" className="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:ring-2 focus:ring-primary focus:border-transparent outline-none" />
                                    </div>
                                </div>
                                <button className="mt-2 text-sm font-bold text-primary hover:underline">Cập nhật mật khẩu</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('view'); // 'view' or 'edit'

            return (
                <div className="min-h-screen flex flex-col">
                    <TopNavBar />
                    <main className="flex-1">
                        {view === 'view' ? (
                            <ProfileView onEdit={() => setView('edit')} />
                        ) : (
                            <EditProfile onCancel={() => setView('view')} onSave={() => setView('view')} />
                        )}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body></html>
