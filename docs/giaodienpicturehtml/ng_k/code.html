<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TournaHub - Đăng ký</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#c9e6ff",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#004c6e",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#38485d",
                        "surface-container-high": "#e6e8ea",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#191c1e",
                        "on-secondary-fixed": "#001e2f",
                        "secondary": "#006591",
                        "on-tertiary-fixed": "#0b1c30",
                        "primary": "#004ac6",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "surface-tint": "#0053db",
                        "on-tertiary-container": "#e9f0ff",
                        "background": "#f7f9fb",
                        "secondary-container": "#39b8fd",
                        "outline": "#737686",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-fixed": "#d3e4fe",
                        "on-secondary-container": "#004666",
                        "secondary-fixed-dim": "#89ceff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#5e6e85",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface": "#f7f9fb",
                        "on-primary-fixed": "#00174b",
                        "on-primary-container": "#eeefff",
                        "primary-container": "#2563eb",
                        "surface-container": "#eceef0",
                        "tertiary": "#46566c",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-padding": "64px",
                        "unit": "4px",
                        "gutter": "24px",
                        "container-max-width": "1200px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Auth Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-surface-variant shadow-sm p-6 sm:p-8">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-display text-display font-bold text-primary mb-2">TournaHub</h1>
<h2 class="font-headline-lg text-headline-lg mb-2">Đăng ký</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Tham gia cộng đồng thể thao lớn nhất</p>
</div>
<!-- Form -->
<form class="space-y-5">
<!-- Name Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="name">Họ và tên</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-2 font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" id="name" name="name" placeholder="Nguyễn Văn A" type="text"/>
</div>
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-2 font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" id="email" name="email" placeholder="email@example.com" type="email"/>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-2 font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Strength Indicator (Example: Medium) -->
<div class="mt-2 flex items-center justify-between">
<div class="flex gap-1 flex-1 mr-2">
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary-container w-1/3"></div>
</div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Yếu</span>
</div>
</div>
<!-- Confirm Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirm-password">Xác nhận mật khẩu</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-2 font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-1 bg-surface-container-lowest cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<div class="ml-2 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                        Tôi đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản sử dụng</a> và <a class="text-primary hover:underline" href="#">Chính sách bảo mật</a>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-2.5 px-4 rounded-lg hover:bg-primary-fixed-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                Đăng ký
            </button>
</form>
<!-- Divider -->
<div class="mt-6 flex items-center justify-between">
<span class="w-1/5 border-b border-surface-variant lg:w-1/4"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase text-center w-3/5 lg:w-2/4">hoặc</span>
<span class="w-1/5 border-b border-surface-variant lg:w-1/4"></span>
</div>
<!-- Google Registration -->
<button class="mt-6 w-full flex items-center justify-center gap-2 bg-surface-container-lowest text-on-surface border border-outline-variant font-label-md text-label-md py-2.5 px-4 rounded-lg hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<svg class="h-5 w-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Đăng ký với Google
        </button>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Đã có tài khoản? <a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Đăng nhập</a>
</p>
</div>
</main>
<script>
        // Simple password strength visual update (example logic)
        const passwordInput = document.getElementById('password');
        const strengthBar = document.querySelector('.bg-secondary-container');
        const strengthText = document.querySelector('.text-on-surface-variant:last-child'); // target "Yếu"

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            if (val.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = 'Trống';
            } else if (val.length < 6) {
                strengthBar.style.width = '33%';
                strengthBar.className = 'h-full bg-error w-1/3 transition-all duration-300';
                strengthText.textContent = 'Yếu';
            } else if (val.length < 10) {
                strengthBar.style.width = '66%';
                strengthBar.className = 'h-full bg-secondary-container w-2/3 transition-all duration-300';
                strengthText.textContent = 'Trung bình';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'h-full bg-primary w-full transition-all duration-300';
                strengthText.textContent = 'Mạnh';
            }
        });
    </script>
</body></html>
