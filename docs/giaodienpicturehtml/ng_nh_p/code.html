<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - TournaHub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#c9e6ff",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#004c6e",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#38485d",
                        "surface-container-high": "#e6e8ea",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#191c1e",
                        "on-secondary-fixed": "#001e2f",
                        "secondary": "#006591",
                        "on-tertiary-fixed": "#0b1c30",
                        "primary": "#004ac6",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "surface-tint": "#0053db",
                        "on-tertiary-container": "#e9f0ff",
                        "background": "#f7f9fb",
                        "secondary-container": "#39b8fd",
                        "outline": "#737686",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-fixed": "#d3e4fe",
                        "on-secondary-container": "#004666",
                        "secondary-fixed-dim": "#89ceff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#5e6e85",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface": "#f7f9fb",
                        "on-primary-fixed": "#00174b",
                        "on-primary-container": "#eeefff",
                        "primary-container": "#2563eb",
                        "surface-container": "#eceef0",
                        "tertiary": "#46566c",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-padding": "64px",
                        "unit": "4px",
                        "gutter": "24px",
                        "container-max-width": "1200px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-surface-variant shadow-sm p-8 flex flex-col gap-8">
<!-- Header -->
<div class="text-center flex flex-col items-center gap-2">
<div class="font-display text-display font-bold text-primary mb-2">TournaHub</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Đăng nhập</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Chào mừng bạn quay trở lại</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-2 border border-surface-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow" id="email" name="email" placeholder="nhap@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 border border-surface-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<button class="text-outline hover:text-on-surface-variant focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-1">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Ghi nhớ
                    </label>
</div>
<div class="font-label-sm text-label-sm">
<a class="text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Quên mật khẩu?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-on-primary-fixed-variant transition-colors mt-2 shadow-sm flex items-center justify-center gap-2" type="submit">
                Đăng nhập
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant">hoặc</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Google Login -->
<button class="w-full bg-surface-container-lowest border border-surface-variant text-on-surface font-label-md text-label-md py-3 rounded-lg hover:bg-surface-container transition-colors flex items-center justify-center gap-3" type="button">
<!-- Google Icon SVG placeholder -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Đăng nhập với Google
        </button>
<!-- Footer -->
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-2">
            Chưa có tài khoản? 
            <a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors ml-1" href="#">Đăng ký ngay</a>
</p>
</div>
</body></html>
